global:
  scrape_interval: 1s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "amazon_review_model"
    static_configs:
      - targets: ["host.docker.internal:8002"] # Gunakan localhost:8002 jika Prometheus dijalankan langsung di Windows, atau host.docker.internal:8002 jika Prometheus dijalankan di Docker
